# System-wide distrobox defaults for the sandbox; ~/.config/distrobox/
# distrobox.conf is read afterwards and may override them. The podman shim
# is wired in through PATH (scripts/distrobox-wrapper.sh), not here.

# Projects stay at the same path inside every distrobox.
container_additional_volumes="/workspace:/workspace"

# Keep the egress proxy variables across sudo inside each distrobox.
container_init_hook="sh /run/host/usr/local/libexec/sandbox/distrobox-init-hook"

# Proxy de egress do sandbox. Roda em um container próprio, ligado à rede
# interna (sem rota para fora) e à rede de saída. O container do agente só
# alcança este proxy; o proxy só encaminha para os hosts da allowlist.

Port 8888
Timeout 600
MaxClients 100

# Somente clientes das redes privadas do Podman. A rede interna é a única
# pela qual o agente chega até aqui.
# Loopback: healthcheck do próprio container.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Sem cabeçalho Via/X-Tinyproxy e sem página de estatísticas.
DisableViaHeader Yes
XTinyproxy No

# Allowlist: tudo que não casar com uma linha do arquivo é negado, inclusive
# pedidos CONNECT (HTTPS).
FilterType ere
FilterCaseSensitive Off
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allowlist.txt"

# CONNECT só para a porta TLS padrão: impede túneis para SSH, SMB etc.
ConnectPort 443

# Sem LogFile/PidFile: com -d o log vai para stdout e o filesystem pode
# ficar somente leitura.
LogLevel Notice

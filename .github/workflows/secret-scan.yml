name: secret-scan

# Segunda barreira contra chaves publicadas: roda mesmo quando o hook local
# não foi ativado ou foi ignorado com --no-verify.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz (arquivo de checksums oficial da release).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (histórico completo)
        # actions/checkout v7.0.1, fixada por commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (versão e checksum fixos)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Varrer todo o histórico
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --verbose --no-banner .'

      - name: Verificação básica do repositório (mesmas regras do hook)
        # Compara com a árvore vazia para avaliar todos os arquivos versionados.
        env:
          SECRET_SCAN_BASE: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
        run: bash .githooks/pre-commit
